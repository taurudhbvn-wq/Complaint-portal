<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration Login - DHBVN</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e, #16213e, #0f0f1f);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }

        /* ===== 3D TEXT UTILITY ===== */
        .text-3d {
            text-shadow:
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b3b3b3,
                0 5px 0 #aaa,
                0 6px 1px rgba(0, 0, 0, .1),
                0 0 5px rgba(0, 0, 0, .1),
                0 1px 3px rgba(0, 0, 0, .3),
                0 3px 5px rgba(0, 0, 0, .2),
                0 5px 10px rgba(0, 0, 0, .25),
                0 10px 10px rgba(0, 0, 0, .2),
                0 20px 20px rgba(0, 0, 0, .15);
            transform: perspective(800px) rotateX(2deg);
            transition: transform 0.3s ease;
        }
        .text-3d:hover {
            transform: perspective(800px) rotateX(0deg) scale(1.02);
        }

        /* ===== BUTTON 3D ===== */
        .btn-3d {
            display: inline-block;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #f7971e, #ffd200);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow:
                0 8px 0 #b87c10,
                0 12px 30px rgba(255, 210, 0, 0.35),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                inset 0 4px 0 rgba(255, 255, 255, 0.3);
            transform: perspective(600px) rotateX(2deg) translateY(0);
            transition: all 0.12s ease;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            user-select: none;
        }
        .btn-3d:active {
            transform: perspective(600px) rotateX(0deg) translateY(6px);
            box-shadow: 0 2px 0 #b87c10, 0 8px 20px rgba(255, 210, 0, 0.3);
        }
        .btn-3d:hover {
            transform: perspective(600px) rotateX(0deg) translateY(-2px);
            box-shadow: 0 10px 0 #b87c10, 0 18px 40px rgba(255, 210, 0, 0.45);
        }

        .btn-3d.primary {
            background: linear-gradient(145deg, #00b894, #00cec9);
            box-shadow: 0 8px 0 #007b6e, 0 12px 30px rgba(0, 206, 201, 0.35);
        }
        .btn-3d.primary:active {
            box-shadow: 0 2px 0 #007b6e, 0 8px 20px rgba(0, 206, 201, 0.3);
        }
        .btn-3d.primary:hover {
            box-shadow: 0 10px 0 #007b6e, 0 18px 40px rgba(0, 206, 201, 0.45);
        }

        .btn-3d.danger {
            background: linear-gradient(145deg, #e17055, #d63031);
            box-shadow: 0 6px 0 #a93226, 0 10px 25px rgba(214, 48, 49, 0.35);
            padding: 10px 22px;
            font-size: 0.9rem;
        }
        .btn-3d.danger:active {
            box-shadow: 0 2px 0 #a93226, 0 6px 15px rgba(214, 48, 49, 0.3);
            transform: translateY(4px);
        }
        .btn-3d.danger:hover {
            box-shadow: 0 8px 0 #a93226, 0 14px 30px rgba(214, 48, 49, 0.45);
            transform: translateY(-2px);
        }

        .btn-3d.success {
            background: linear-gradient(145deg, #00b894, #00a86b);
            box-shadow: 0 6px 0 #007a4d, 0 10px 25px rgba(0, 184, 148, 0.35);
            padding: 10px 22px;
            font-size: 0.9rem;
        }
        .btn-3d.success:active {
            box-shadow: 0 2px 0 #007a4d, 0 6px 15px rgba(0, 184, 148, 0.3);
            transform: translateY(4px);
        }
        .btn-3d.success:hover {
            box-shadow: 0 8px 0 #007a4d, 0 14px 30px rgba(0, 184, 148, 0.45);
            transform: translateY(-2px);
        }

        .btn-3d.secondary {
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            box-shadow: 0 6px 0 #4834b5, 0 10px 25px rgba(108, 92, 231, 0.35);
            padding: 10px 22px;
            font-size: 0.9rem;
        }
        .btn-3d.secondary:active {
            box-shadow: 0 2px 0 #4834b5, 0 6px 15px rgba(108, 92, 231, 0.3);
            transform: translateY(4px);
        }
        .btn-3d.secondary:hover {
            box-shadow: 0 8px 0 #4834b5, 0 14px 30px rgba(108, 92, 231, 0.45);
            transform: translateY(-2px);
        }

        .btn-3d.sm {
            padding: 10px 24px;
            font-size: 0.95rem;
        }
        .btn-3d.xs {
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 10px;
        }

        /* ===== DETAILS TOGGLE BUTTON (LONG) ===== */
        .btn-3d.details-toggle {
            background: linear-gradient(145deg, #2d3436, #636e72);
            box-shadow: 0 6px 0 #1e272e, 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 12px 30px;
            font-size: 1rem;
            width: 100%;
            border-radius: 14px;
            text-align: center;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-3d.details-toggle:hover {
            transform: perspective(600px) rotateX(0deg) translateY(-2px);
            box-shadow: 0 8px 0 #1e272e, 0 16px 40px rgba(0, 0, 0, 0.4);
            background: linear-gradient(145deg, #3d4446, #747d80);
        }
        .btn-3d.details-toggle.active {
            background: linear-gradient(145deg, #00b894, #00cec9);
            box-shadow: 0 6px 0 #007b6e, 0 10px 25px rgba(0, 206, 201, 0.3);
        }
        .btn-3d.details-toggle.active:hover {
            box-shadow: 0 8px 0 #007b6e, 0 16px 40px rgba(0, 206, 201, 0.4);
            background: linear-gradient(145deg, #00c9a0, #00e0db);
        }

        /* ===== LOGIN VIEW ===== */
        #login-view {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 48px;
            padding: 50px 40px 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: fadeUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }
        #login-view::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.04), transparent 60%);
            pointer-events: none;
        }

        .login-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 210, 0, 0.15);
            transform: perspective(600px) rotateX(3deg);
        }
        .login-sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .login-form .form-group {
            margin-bottom: 22px;
        }
        .login-form label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .login-form input:focus {
            border-color: #ffd200;
            background: rgba(255, 255, 255, 0.10);
            box-shadow: 0 0 30px rgba(255, 210, 0, 0.05);
        }
        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 18px;
            font-size: 1.2rem;
            border-radius: 20px;
        }

        .developer-credit {
            text-align: center;
            margin-top: 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            animation: float3d 3s ease-in-out infinite;
            transform-style: preserve-3d;
            perspective: 600px;
        }
        .developer-credit span {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 210, 0, 0.15);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 24px;
        }
        .login-error.show {
            opacity: 1;
        }

        /* ===== DASHBOARD VIEW ===== */
        #dashboard-view {
            width: 100%;
            max-width: 700px;
            text-align: center;
            animation: fadeUp 0.7s ease;
        }
        .dashboard-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }
        .dashboard-sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            margin-bottom: 45px;
            letter-spacing: 2px;
        }
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .dashboard-main-btn {
            padding: 28px 60px;
            font-size: 1.8rem;
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            letter-spacing: 1px;
        }
        .dashboard-logout {
            margin-top: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .dashboard-logout:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== CATEGORIES VIEW ===== */
        #categories-view {
            width: 100%;
            max-width: 800px;
            animation: fadeUp 0.6s ease;
        }
        .categories-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .categories-header h2 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 600;
        }
        .categories-header .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .categories-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .category-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: perspective(600px) rotateX(2deg);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        .category-card:hover {
            transform: perspective(600px) rotateX(0deg) translateY(-6px);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.07);
        }
        .category-card .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
        }
        .category-card .name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .category-card .badge {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd200;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ===== FORM & ENTRIES VIEW ===== */
        #form-view {
            width: 100%;
            max-width: 900px;
            animation: fadeUp 0.5s ease;
        }
        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .form-header h2 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .form-header .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .form-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 30px 30px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            transform: perspective(800px) rotateX(1deg);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }
        .form-row .full {
            grid-column: 1 / -1;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
            width: 100%;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #ffd200;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(255, 210, 0, 0.04);
        }
        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .upload-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .upload-area .file-input-wrap {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .upload-area .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .upload-area .file-input-wrap .fake-btn {
            display: inline-block;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area .file-input-wrap .fake-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .upload-area .camera-btn {
            padding: 10px 22px;
            background: rgba(0, 206, 201, 0.15);
            border: 1px solid rgba(0, 206, 201, 0.2);
            border-radius: 30px;
            color: #00cec9;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area .camera-btn:hover {
            background: rgba(0, 206, 201, 0.25);
        }
        .upload-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }
        .upload-area .file-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* ===== ENTRIES LIST ===== */
        .entries-section {
            margin-top: 10px;
        }
        .entries-section h3 {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        /* ---- ENTRY CARD (Collapsible) ---- */
        .entry-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            transform: perspective(600px) rotateX(1deg);
            overflow: hidden;
        }
        .entry-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .entry-card.resolved {
            opacity: 0.6;
            border-color: rgba(0, 184, 148, 0.2);
            background: rgba(0, 184, 148, 0.04);
        }

        /* Card header - always visible */
        .entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            gap: 12px;
            flex-wrap: wrap;
            cursor: pointer;
            transition: background 0.2s;
        }
        .entry-header:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .entry-header .entry-id-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .entry-header .entry-id-badge .no {
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .entry-header .entry-id-badge .status-badge {
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd200;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .entry-header .entry-id-badge .status-badge.resolved-badge {
            background: rgba(0, 184, 148, 0.15);
            color: #00b894;
            border-color: rgba(0, 184, 148, 0.1);
        }
        .entry-header .entry-meta-small {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.75rem;
        }
        .entry-header .entry-meta-small .label {
            color: rgba(255, 255, 255, 0.2);
        }
        .entry-header .entry-meta-small .value {
            color: rgba(255, 255, 255, 0.5);
        }
        .entry-header .toggle-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Details toggle button (long) */
        .btn-details-toggle {
            padding: 10px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(145deg, #2d3436, #636e72);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #1e272e, 0 6px 20px rgba(0, 0, 0, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            min-width: 120px;
            text-align: center;
            letter-spacing: 0.5px;
            position: relative;
            transform: perspective(400px) rotateX(1deg);
        }
        .btn-details-toggle:hover {
            transform: perspective(400px) rotateX(0deg) translateY(-2px);
            box-shadow: 0 6px 0 #1e272e, 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        .btn-details-toggle:active {
            transform: perspective(400px) rotateX(0deg) translateY(4px);
            box-shadow: 0 1px 0 #1e272e;
        }
        .btn-details-toggle.active {
            background: linear-gradient(145deg, #00b894, #00cec9);
            box-shadow: 0 4px 0 #007b6e, 0 8px 25px rgba(0, 206, 201, 0.3);
        }
        .btn-details-toggle.active:hover {
            box-shadow: 0 6px 0 #007b6e, 0 14px 35px rgba(0, 206, 201, 0.4);
        }

        /* Card body - hidden by default, shown when toggled */
        .entry-body {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.3s ease;
        }
        .entry-body.open {
            display: block;
        }

        .entry-body .complaint-full {
            margin-top: 16px;
        }
        .entry-body .complaint-full .complaint-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 3px solid rgba(255, 215, 0, 0.2);
        }
        .entry-body .doc-section {
            margin-top: 14px;
        }
        .entry-body .doc-section .doc-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .entry-body .doc-section .entry-docs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .entry-body .doc-section .entry-docs img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }
        .entry-body .doc-section .entry-docs .file-tag {
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Detail history */
        .entry-body .detail-history {
            margin-top: 16px;
        }
        .entry-body .detail-history .dh-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .entry-body .detail-history .detail-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            border-left: 2px solid rgba(108, 92, 231, 0.2);
        }
        .entry-body .detail-history .detail-item .detail-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            flex: 1;
            min-width: 120px;
        }
        .entry-body .detail-history .detail-item .detail-docs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .entry-body .detail-history .detail-item .detail-docs img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }
        .entry-body .detail-history .detail-item .detail-docs .file-tag-sm {
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
        }
        .entry-body .detail-history .detail-item .detail-time {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            margin-left: auto;
        }

        /* Add detail form inside body */
        .entry-body .add-detail-form {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .entry-body .add-detail-form textarea {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }
        .entry-body .add-detail-form textarea:focus {
            border-color: rgba(255, 215, 0, 0.3);
        }
        .entry-body .add-detail-form .detail-upload {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .entry-body .add-detail-form .detail-upload input[type="file"] {
            display: none;
        }
        .entry-body .add-detail-form .detail-upload label {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .entry-body .add-detail-form .detail-upload label:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .entry-body .entry-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            align-items: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
        }

        /* ===== CAMERA MODAL ===== */
        .camera-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeUp 0.4s ease;
        }
        .camera-modal .cam-box {
            background: #0f0f1f;
            border-radius: 28px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }
        .camera-modal .cam-box video {
            width: 100%;
            border-radius: 16px;
            background: #000;
            display: block;
        }
        .camera-modal .cam-box .cam-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .camera-modal .cam-box .cam-controls button {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .camera-modal .cam-box .cam-controls .capture-btn {
            background: linear-gradient(145deg, #00b894, #00cec9);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.3);
        }
        .camera-modal .cam-box .cam-controls .capture-btn:hover {
            transform: scale(1.04);
        }
        .camera-modal .cam-box .cam-controls .close-cam {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
        }
        .camera-modal .cam-box .cam-controls .close-cam:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px) perspective(600px) rotateX(2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) perspective(600px) rotateX(0deg);
            }
        }
        @keyframes float3d {
            0%,
            100% {
                transform: perspective(600px) rotateX(2deg) translateY(0);
            }
            50% {
                transform: perspective(600px) rotateX(0deg) translateY(-6px);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            #login-view {
                padding: 30px 20px 30px;
                border-radius: 32px;
            }
            .login-title {
                font-size: 2rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .categories-grid {
                grid-template-columns: 1fr 1fr;
            }
            .dashboard-main-btn {
                font-size: 1.3rem;
                padding: 20px 30px;
            }
            .btn-3d {
                padding: 12px 24px;
                font-size: 1rem;
            }
            .form-card {
                padding: 20px 16px;
            }
            .category-card {
                padding: 20px 12px;
            }
            .category-card .icon {
                font-size: 2rem;
            }
            .entry-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .entry-header .toggle-area {
                justify-content: flex-end;
            }
            .entry-body .add-detail-form {
                flex-direction: column;
                align-items: stretch;
            }
            .camera-modal .cam-box {
                padding: 14px;
            }
            .btn-details-toggle {
                width: 100%;
                min-width: unset;
            }
        }
        @media (max-width: 420px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
            .login-title {
                font-size: 1.6rem;
            }
            .developer-credit {
                font-size: 0.9rem;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN VIEW ===== -->
    <div id="login-view">
        <div class="login-title text-3d">Administration Login</div>
        <div class="login-sub">DHBVN · Secure Access</div>

        <form class="login-form" id="login-form" autocomplete="off">
            <div class="form-group">
                <label>User ID</label>
                <input type="text" id="login-id" placeholder="Enter User ID" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter Password" />
            </div>
            <button type="submit" class="btn-3d login-btn">🔐 Login</button>
            <div class="login-error" id="login-error">Invalid ID or Password</div>
        </form>

        <div class="developer-credit">
            <span>✦ Developed by Rakesh Kumar ✦</span>
        </div>
    </div>

    <!-- ===== DASHBOARD VIEW ===== -->
    <div id="dashboard-view" class="hidden">
        <div class="dashboard-title text-3d">🏛️ Administration Dashboard</div>
        <div class="dashboard-sub">DHBVN · Complaint Management System</div>
        <div class="dashboard-grid">
            <button class="btn-3d dashboard-main-btn" id="go-to-categories">
                📋 Running Complaint Status
            </button>
            <button class="dashboard-logout" id="logout-btn">🚪 Logout</button>
        </div>
    </div>

    <!-- ===== CATEGORIES VIEW ===== -->
    <div id="categories-view" class="hidden">
        <div class="categories-header">
            <h2>📂 Select Complaint Category</h2>
            <button class="back-btn" id="back-to-dashboard">← Dashboard</button>
        </div>
        <div class="categories-grid" id="categories-grid">
            <!-- dynamically populated -->
        </div>
    </div>

    <!-- ===== FORM & ENTRIES VIEW ===== -->
    <div id="form-view" class="hidden">
        <div class="form-header">
            <h2 id="form-category-title">📝 Category Name</h2>
            <button class="back-btn" id="back-to-categories">← Categories</button>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label>Complaint No.</label>
                    <input type="text" id="complaint-no" placeholder="e.g. DHB-2026-001" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="complaint-status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Under Review">Under Review</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full">
                    <label>Complaint Details</label>
                    <textarea id="complaint-text" placeholder="Describe the complaint in detail..."></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full">
                    <label>Upload Documents</label>
                    <div class="upload-area">
                        <div class="file-input-wrap">
                            <span class="fake-btn">📁 Choose File</span>
                            <input type="file" id="doc-upload" accept="image/*,application/pdf" multiple />
                        </div>
                        <button class="camera-btn" id="camera-open-btn">📸 Open Camera</button>
                        <div class="file-preview" id="doc-preview"></div>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-3d primary sm" id="submit-complaint">✅ Submit Complaint</button>
                <button class="btn-3d secondary sm" id="reset-form">↺ Reset</button>
            </div>
        </div>

        <!-- Entries List -->
        <div class="entries-section">
            <h3 id="entries-count">📋 Entries (0)</h3>
            <div id="entries-container"></div>
        </div>
    </div>

    <!-- ===== CAMERA MODAL ===== -->
    <div class="camera-modal hidden" id="camera-modal">
        <div class="cam-box">
            <video id="camera-video" autoplay playsinline></video>
            <div class="cam-controls">
                <button class="capture-btn" id="capture-photo">📸 Capture</button>
                <button class="close-cam" id="close-camera">✕ Close</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const STATE_KEY = 'dhbvn_complaint_data';
        let appData = loadState();
        let currentCategory = null;
        let cameraStream = null;
        let pendingDocFiles = [];

        // ============================================================
        //  DATA LAYER
        // ============================================================
        function defaultState() {
            return {
                categories: {
                    'cm_window': { label: 'CM Window', icon: '🏛️', entries: [] },
                    'acs_complaints': { label: 'ACS Complaints', icon: '⚡', entries: [] },
                    'pm_portal': { label: 'PM Portal', icon: '🇮🇳', entries: [] },
                    'smgt_complaint': { label: 'SMGT Complaint', icon: '🔧', entries: [] },
                    'samadhaan_shivir': { label: 'Samadhaan Shivir', icon: '🤝', entries: [] }
                }
            };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STATE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const def = defaultState();
                    for (const key of Object.keys(def.categories)) {
                        if (!parsed.categories[key]) {
                            parsed.categories[key] = def.categories[key];
                        }
                        if (!parsed.categories[key].entries) {
                            parsed.categories[key].entries = [];
                        }
                    }
                    return parsed;
                }
            } catch (_) { /* ignore */ }
            return defaultState();
        }

        function saveState() {
            localStorage.setItem(STATE_KEY, JSON.stringify(appData));
        }

        function getCategoryEntries(catKey) {
            return appData.categories[catKey]?.entries || [];
        }

        function setCategoryEntries(catKey, entries) {
            if (appData.categories[catKey]) {
                appData.categories[catKey].entries = entries;
                saveState();
            }
        }

        function addEntry(catKey, entry) {
            const entries = getCategoryEntries(catKey);
            entries.push(entry);
            setCategoryEntries(catKey, entries);
        }

        function updateEntry(catKey, entryId, updater) {
            const entries = getCategoryEntries(catKey);
            const idx = entries.findIndex(e => e.id === entryId);
            if (idx !== -1) {
                entries[idx] = updater(entries[idx]);
                setCategoryEntries(catKey, entries);
            }
        }

        function deleteEntry(catKey, entryId) {
            const entries = getCategoryEntries(catKey);
            const filtered = entries.filter(e => e.id !== entryId);
            setCategoryEntries(catKey, filtered);
        }

        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
        }

        // ============================================================
        //  VIEW HELPERS
        // ============================================================
        function showView(viewId) {
            document.querySelectorAll('#login-view, #dashboard-view, #categories-view, #form-view')
                .forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // ============================================================
        //  LOGIN
        // ============================================================
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (id === 'DHBVN' && pass === 'DHBVN') {
                loginError.classList.remove('show');
                showView('dashboard-view');
            } else {
                loginError.textContent = '❌ Invalid ID or Password. Please use DHBVN / DHBVN';
                loginError.classList.add('show');
            }
        });

        // ============================================================
        //  DASHBOARD
        // ============================================================
        document.getElementById('go-to-categories').addEventListener('click', () => {
            renderCategories();
            showView('categories-view');
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            document.getElementById('login-id').value = '';
            document.getElementById('login-pass').value = '';
            loginError.classList.remove('show');
            showView('login-view');
        });

        // ============================================================
        //  CATEGORIES
        // ============================================================
        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';
            for (const [key, cat] of Object.entries(appData.categories)) {
                const count = cat.entries.length;
                const div = document.createElement('div');
                div.className = 'category-card';
                div.innerHTML = `
                    <span class="icon">${cat.icon || '📂'}</span>
                    <div class="name">${cat.label || key}</div>
                    <span class="badge">${count} entries</span>
                `;
                div.addEventListener('click', () => openCategory(key));
                grid.appendChild(div);
            }
        }

        document.getElementById('back-to-dashboard').addEventListener('click', () => {
            showView('dashboard-view');
        });

        function openCategory(catKey) {
            currentCategory = catKey;
            const cat = appData.categories[catKey];
            document.getElementById('form-category-title').textContent =
                `${cat.icon || '📂'} ${cat.label || catKey}`;
            resetForm();
            renderEntries(catKey);
            showView('form-view');
        }

        document.getElementById('back-to-categories').addEventListener('click', () => {
            showView('categories-view');
            renderCategories();
        });

        // ============================================================
        //  FORM
        // ============================================================
        const complaintNo = document.getElementById('complaint-no');
        const complaintStatus = document.getElementById('complaint-status');
        const complaintText = document.getElementById('complaint-text');
        const docUpload = document.getElementById('doc-upload');
        const docPreview = document.getElementById('doc-preview');
        const submitBtn = document.getElementById('submit-complaint');
        const resetBtn = document.getElementById('reset-form');
        const cameraOpenBtn = document.getElementById('camera-open-btn');

        docUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            pendingDocFiles.push(...files);
            renderDocPreview();
            docUpload.value = '';
        });

        function renderDocPreview() {
            docPreview.innerHTML = '';
            for (const file of pendingDocFiles) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = document.createElement('img');
                        img.src = ev.target.result;
                        img.title = file.name;
                        docPreview.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                } else {
                    const span = document.createElement('span');
                    span.style.cssText =
                        'padding:6px 14px;background:rgba(255,255,255,0.05);border-radius:20px;font-size:0.75rem;color:rgba(255,255,255,0.5);';
                    span.textContent = `📄 ${file.name}`;
                    docPreview.appendChild(span);
                }
            }
        }

        function resetForm() {
            complaintNo.value = '';
            complaintStatus.value = 'Pending';
            complaintText.value = '';
            pendingDocFiles = [];
            docPreview.innerHTML = '';
            docUpload.value = '';
        }
        resetBtn.addEventListener('click', resetForm);

        // Camera
        cameraOpenBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                cameraStream = stream;
                const video = document.getElementById('camera-video');
                video.srcObject = stream;
                document.getElementById('camera-modal').classList.remove('hidden');
            } catch (err) {
                alert('❌ Camera access denied. Please allow camera permissions.');
                console.error(err);
            }
        });

        document.getElementById('close-camera').addEventListener('click', closeCamera);
        document.getElementById('capture-photo').addEventListener('click', () => {
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
                if (blob) {
                    const file = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
                    pendingDocFiles.push(file);
                    renderDocPreview();
                    closeCamera();
                }
            }, 'image/jpeg');
        });

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            document.getElementById('camera-modal').classList.add('hidden');
            const video = document.getElementById('camera-video');
            video.srcObject = null;
        }

        // Submit
        submitBtn.addEventListener('click', () => {
            if (!currentCategory) return;
            const no = complaintNo.value.trim();
            const text = complaintText.value.trim();
            if (!no || !text) {
                alert('❌ Please fill in Complaint No. and Complaint Details.');
                return;
            }

            const filePromises = pendingDocFiles.map((file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({ name: file.name, type: file.type, data: e.target.result });
                    reader.readAsDataURL(file);
                });
            });

            Promise.all(filePromises).then((fileData) => {
                const entry = {
                    id: generateId(),
                    complaintNo: no,
                    complaint: text,
                    status: complaintStatus.value,
                    documents: fileData,
                    details: [],
                    resolved: false,
                    createdAt: Date.now()
                };
                addEntry(currentCategory, entry);
                resetForm();
                renderEntries(currentCategory);
                renderCategories();
            });
        });

        // ============================================================
        //  ENTRIES (Collapsible with Details Toggle)
        // ============================================================
        function renderEntries(catKey) {
            const container = document.getElementById('entries-container');
            const entries = getCategoryEntries(catKey);
            const countEl = document.getElementById('entries-count');
            countEl.textContent = `📋 Entries (${entries.length})`;

            if (entries.length === 0) {
                container.innerHTML = `<div class="empty-state">No complaints yet. Submit your first complaint above.</div>`;
                return;
            }

            const sorted = [...entries].sort((a, b) => {
                if (a.resolved && !b.resolved) return 1;
                if (!a.resolved && b.resolved) return -1;
                return b.createdAt - a.createdAt;
            });

            container.innerHTML = '';
            for (const entry of sorted) {
                const card = createEntryCard(catKey, entry);
                container.appendChild(card);
            }
        }

        function createEntryCard(catKey, entry) {
            const div = document.createElement('div');
            div.className = `entry-card${entry.resolved ? ' resolved' : ''}`;
            div.dataset.entryId = entry.id;

            const isResolved = entry.resolved;
            const statusLabel = entry.status || 'Pending';
            const statusClass = isResolved ? 'resolved-badge' : '';

            // ---- HEADER (always visible) ----
            const header = document.createElement('div');
            header.className = 'entry-header';

            // Left side: complaint no + status
            const idBadge = document.createElement('div');
            idBadge.className = 'entry-id-badge';
            idBadge.innerHTML = `
                <span class="no">📌 ${escapeHtml(entry.complaintNo)}</span>
                <span class="status-badge ${statusClass}">${escapeHtml(statusLabel)}${isResolved ? ' ✅' : ''}</span>
            `;

            // Right side: small meta + toggle button
            const toggleArea = document.createElement('div');
            toggleArea.className = 'toggle-area';

            const metaSmall = document.createElement('span');
            metaSmall.className = 'entry-meta-small';
            metaSmall.innerHTML = `
                <span><span class="label">Submitted:</span> <span class="value">${new Date(entry.createdAt).toLocaleDateString()}</span></span>
                <span><span class="label">Details:</span> <span class="value">${entry.details ? entry.details.length : 0}</span></span>
            `;

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn-details-toggle';
            toggleBtn.textContent = '📋 Details';
            toggleBtn.dataset.entryId = entry.id;

            toggleArea.appendChild(metaSmall);
            toggleArea.appendChild(toggleBtn);

            header.appendChild(idBadge);
            header.appendChild(toggleArea);
            div.appendChild(header);

            // ---- BODY (collapsible) ----
            const body = document.createElement('div');
            body.className = 'entry-body';
            body.id = `body-${entry.id}`;

            // Complaint text
            const complaintFull = document.createElement('div');
            complaintFull.className = 'complaint-full';
            complaintFull.innerHTML = `
                <div class="complaint-text">📝 ${escapeHtml(entry.complaint)}</div>
            `;
            body.appendChild(complaintFull);

            // Documents
            if (entry.documents && entry.documents.length) {
                const docSection = document.createElement('div');
                docSection.className = 'doc-section';
                let docsHtml = `<div class="doc-label">📎 Attached Documents</div><div class="entry-docs">`;
                for (const doc of entry.documents) {
                    if (doc.type && doc.type.startsWith('image/')) {
                        docsHtml += `<img src="${doc.data}" alt="doc" onclick="window.open('${doc.data}','_blank')" />`;
                    } else {
                        docsHtml += `<span class="file-tag">📄 ${escapeHtml(doc.name || 'file')}</span>`;
                    }
                }
                docsHtml += `</div>`;
                docSection.innerHTML = docsHtml;
                body.appendChild(docSection);
            }

            // Detail history
            if (entry.details && entry.details.length) {
                const histSection = document.createElement('div');
                histSection.className = 'detail-history';
                let histHtml = `<div class="dh-label">📜 Detail History (${entry.details.length})</div>`;
                for (const d of entry.details) {
                    let dDocs = '';
                    if (d.documents && d.documents.length) {
                        dDocs = `<div class="detail-docs">`;
                        for (const dd of d.documents) {
                            if (dd.type && dd.type.startsWith('image/')) {
                                dDocs +=
                                    `<img src="${dd.data}" alt="doc" onclick="window.open('${dd.data}','_blank')" />`;
                            } else {
                                dDocs += `<span class="file-tag-sm">📄 ${escapeHtml(dd.name || 'file')}</span>`;
                            }
                        }
                        dDocs += `</div>`;
                    }
                    histHtml += `
                        <div class="detail-item">
                            <span class="detail-text">${escapeHtml(d.text)}</span>
                            ${dDocs}
                            <span class="detail-time">${new Date(d.timestamp).toLocaleString()}</span>
                        </div>
                    `;
                }
                histSection.innerHTML = histHtml;
                body.appendChild(histSection);
            }

            // Add detail form
            const addForm = document.createElement('div');
            addForm.className = 'add-detail-form';
            addForm.id = `detail-form-${entry.id}`;
            addForm.innerHTML = `
                <textarea placeholder="Add more detail..." id="detail-text-${entry.id}"></textarea>
                <div class="detail-upload">
                    <input type="file" id="detail-file-${entry.id}" accept="image/*,application/pdf" multiple />
                    <label for="detail-file-${entry.id}">📎 Upload</label>
                </div>
                <button class="btn-3d secondary xs" data-add-detail="${entry.id}">➕ Add Detail</button>
            `;
            body.appendChild(addForm);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'entry-actions';
            actions.innerHTML = `
                <button class="btn-3d danger xs" data-delete="${entry.id}">🗑️ Delete</button>
                ${!entry.resolved ? `<button class="btn-3d success xs" data-resolve="${entry.id}">✅ Resolve</button>` : ''}
                <span style="font-size:0.6rem;color:rgba(255,255,255,0.15);margin-left:auto;">ID: ${entry.id.slice(0,8)}</span>
            `;
            body.appendChild(actions);

            div.appendChild(body);

            // ---- Toggle logic ----
            let isOpen = false;
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isOpen = !isOpen;
                body.classList.toggle('open', isOpen);
                toggleBtn.classList.toggle('active', isOpen);
                toggleBtn.textContent = isOpen ? '📋 Hide Details' : '📋 Details';
            });

            // Also toggle on header click (but not on buttons inside)
            header.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                toggleBtn.click();
            });

            // ---- Event Listeners for actions ----

            // Delete
            const deleteBtn = actions.querySelector('[data-delete]');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => {
                    if (confirm('Are you sure you want to delete this complaint?')) {
                        deleteEntry(catKey, entry.id);
                        renderEntries(catKey);
                        renderCategories();
                    }
                });
            }

            // Resolve
            const resolveBtn = actions.querySelector('[data-resolve]');
            if (resolveBtn) {
                resolveBtn.addEventListener('click', () => {
                    updateEntry(catKey, entry.id, (e) => ({ ...e, resolved: true }));
                    renderEntries(catKey);
                    renderCategories();
                });
            }

            // Add Detail
            const addBtn = addForm.querySelector('[data-add-detail]');
            if (addBtn) {
                addBtn.addEventListener('click', () => {
                    const textarea = document.getElementById(`detail-text-${entry.id}`);
                    const fileInput = document.getElementById(`detail-file-${entry.id}`);
                    const text = textarea.value.trim();
                    if (!text) {
                        alert('Please enter some detail text.');
                        return;
                    }

                    const files = Array.from(fileInput.files);
                    const filePromises = files.map((file) => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve({ name: file.name, type: file.type,
                                data: e.target.result });
                            reader.readAsDataURL(file);
                        });
                    });

                    Promise.all(filePromises).then((fileData) => {
                        const detail = {
                            text: text,
                            documents: fileData,
                            timestamp: Date.now()
                        };
                        updateEntry(catKey, entry.id, (e) => {
                            const details = [...(e.details || []), detail];
                            return { ...e, details };
                        });
                        textarea.value = '';
                        fileInput.value = '';
                        // Re-render to show updated details
                        renderEntries(catKey);
                        renderCategories();
                        // Re-open the details after re-render
                        const newCard = document.querySelector(`.entry-card[data-entry-id="${entry.id}"]`);
                        if (newCard) {
                            const newBody = newCard.querySelector('.entry-body');
                            const newBtn = newCard.querySelector('.btn-details-toggle');
                            if (newBody && newBtn) {
                                newBody.classList.add('open');
                                newBtn.classList.add('active');
                                newBtn.textContent = '📋 Hide Details';
                            }
                        }
                    });
                });
            }

            // File input for detail - show count
            const detailFileInput = addForm.querySelector(`#detail-file-${entry.id}`);
            if (detailFileInput) {
                detailFileInput.addEventListener('change', (e) => {
                    const count = e.target.files.length;
                    const label = detailFileInput.nextElementSibling;
                    if (label) {
                        label.textContent = count > 0 ? `📎 ${count} file(s)` : '📎 Upload';
                    }
                });
            }

            return div;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  INIT
        // ============================================================
        showView('login-view');
        document.getElementById('login-id').value = '';
        document.getElementById('login-pass').value = '';

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCamera();
        });

        document.getElementById('camera-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeCamera();
        });

        console.log('🚀 DHBVN Complaint System loaded.');
        console.log('📦 Data:', appData);
    </script>

</body>
</html>
